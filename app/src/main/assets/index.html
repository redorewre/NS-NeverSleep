<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114" id="meta-theme">
<title>NS — NeverSleep</title>
<style>
*{box-sizing:border-box}
:root{
 color-scheme:dark;
 --a1:#d0bcff; --a1c:#4f378b; --on-a1:#381e72;
 --a2:#efb8c8; --a2c:#633b48; --on-a2:#491f2b;
 --bg:#111114; --surface:#1c1c20; --card:#1a1a1e; --card2:#242429;
 --on:#f2f0f5; --muted:#a5a2ac; --line:#37363e;
 --ctrl:clamp(58px,17vw,88px); --ctrl-s:clamp(36px,10vw,48px); --ctrl-main:clamp(78px,24vw,112px); --pgap:clamp(12px,2.4vh,20px);
}
html,body{margin:0;height:100%}
body{
 font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
 background:var(--bg);color:var(--on);
 -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button,input{font:inherit}
.app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
 width:40px;height:40px;border-radius:13px;flex:none;
 background:var(--a1);
 color:var(--on-a1);display:grid;place-items:center;
 font-weight:800;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:18px;letter-spacing:.7px}
.brand-text span{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
.head-actions{display:flex;align-items:center;gap:8px}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.icon-btn:active{background:var(--card2);color:var(--on)}
.icon-btn.add{background:var(--card);border:1px solid var(--line);color:var(--a2)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.view[hidden]{display:none}
.searchbox{
 display:flex;align-items:center;gap:10px;height:50px;padding:0 12px 0 14px;
 background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--muted);
}
.searchbox svg{flex:none}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--on);font-size:15px}
.searchbox input::placeholder{color:var(--muted);opacity:.85}
.list-head{
 display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);
 font-size:12px;text-transform:uppercase;letter-spacing:1.1px;padding:18px 4px 10px;
}
.tracks{display:flex;flex-direction:column;gap:10px}
.track{
 display:flex;align-items:center;gap:14px;background:var(--card);
 border:1px solid var(--line);border-radius:19px;padding:14px;
 cursor:pointer;transition:transform .15s,background .15s,border-color .15s;
}
.track:active{transform:scale(.985);background:var(--card2)}
.track.current{border-color:var(--a2);background:var(--card2)}
.cover{
 width:56px;height:56px;flex:none;border-radius:16px;
 background:var(--a1);
 color:var(--on-a1);display:grid;place-items:center;
 font-weight:800;font-size:18px;position:relative;
}
.track .cover::after{
 content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
 background:linear-gradient(110deg,var(--a1),var(--a2),var(--a1),var(--a2));
 background-size:300% 100%;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 animation:coverFlow 4s linear infinite;pointer-events:none;
}
@keyframes coverFlow{from{background-position:0 0}to{background-position:300% 0}}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.meta b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fav-btn{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.fav-btn.on{color:var(--a2)}
.fav-btn:active{background:var(--card2)}
.empty{text-align:center;color:var(--muted);padding:52px 20px}
.empty svg{color:var(--a2);opacity:.9}
.empty b{display:block;color:var(--on);margin:14px 0 6px;font-size:17px}
.empty p{margin:0 0 18px;font-size:13px;line-height:1.5}
.primary-btn{border:0;border-radius:16px;background:var(--a2);color:var(--on-a2);font-weight:600;font-size:14px;padding:12px 20px;cursor:pointer}
.playlists{display:flex;flex-direction:column;gap:12px}
.playlist{
 display:flex;align-items:center;gap:14px;width:100%;text-align:left;
 background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;
 color:var(--on);transition:transform .15s,background .15s;
}
.playlist:active{transform:scale(.985);background:var(--card2)}
.playlist-art{
 width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;
 background:var(--a1);color:var(--on-a1);
}
.playlist-art.likes{background:var(--a2);color:var(--on-a2)}
.playlist-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.playlist-meta b{font-size:16px;font-weight:600}
.playlist-meta span{font-size:12px;color:var(--muted)}
.playlist-chevron{color:var(--muted);flex:none}
.subhead{display:flex;align-items:center;gap:10px;padding:12px 4px 10px}
.subhead b{flex:1;text-align:center;font-size:17px;font-weight:600}
.subhead .side{width:36px}
.bottom{display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.tab{
 position:relative;flex:1;min-height:52px;border:0;border-radius:16px;background:transparent;
 color:var(--muted);cursor:pointer;display:grid;place-items:center;
}
.tab::before{content:"";position:absolute;inset:0;border-radius:16px;background:var(--a1);opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s}
.tab.active{color:var(--a1)}
.tab.active::before{opacity:.18;transform:scale(1)}
.tab>*{position:relative;z-index:1}
.tab.active[data-tab="fav"] svg{fill:currentColor}
.badge{
 position:absolute;top:4px;right:calc(50% - 23px);z-index:2;min-width:18px;height:18px;padding:0 5px;
 border-radius:9px;background:var(--a2);color:var(--on-a2);font-size:10px;
 display:none;place-items:center;font-variant-numeric:tabular-nums;
}
.badge.show{display:grid}
.mini{background:var(--card2);border-top:1px solid var(--line);padding:8px 12px 6px;cursor:pointer}
.mini[hidden]{display:none}
.mini-row{display:flex;align-items:center;gap:10px}
.mini .cover{width:38px;height:38px;border-radius:11px;font-size:14px}
.mini-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mini-meta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-meta span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sub em{font-style:normal;color:var(--a2)}
.wave{display:block;width:100%;height:22px;margin-top:6px;touch-action:none;cursor:pointer}
.mini .wave{height:18px}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:stretch;justify-content:center}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet-panel{
 position:relative;width:100%;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
 background:var(--bg);display:flex;flex-direction:column;
 padding:calc(14px + env(safe-area-inset-top)) 18px calc(56px + env(safe-area-inset-bottom));
}
.sheet-panel>*{position:relative;z-index:1}
.sheet-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(20px,4vh,38px);min-height:0}
.sheet-info{display:flex;flex-direction:column;gap:clamp(16px,3vh,26px);flex:none}
.sheet-bottom{display:flex;flex-direction:column;gap:clamp(10px,2vh,16px);width:100%;max-width:440px;margin:0 auto;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:40px;color:var(--on);gap:8px}
.np-heading{display:flex;flex-direction:column;align-items:center;gap:2px;text-transform:none;letter-spacing:0;flex:1}
.np-heading b{font-size:13px;font-weight:600;color:var(--on)}
.np-heading span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.np-top-btn{
 flex:none;border:0;background:transparent;color:var(--muted);width:40px;height:40px;
 border-radius:14px;display:grid;place-items:center;cursor:pointer;
}
.np-top-btn:active{background:var(--card2)}
.np-menu{
 position:absolute;right:18px;top:calc(58px + env(safe-area-inset-top));z-index:3;
 min-width:200px;padding:6px;border-radius:14px;background:var(--card);
 border:1px solid var(--line);box-shadow:0 14px 32px rgba(0,0,0,.5);
 display:flex;flex-direction:column;gap:2px;
}
.np-menu[hidden]{display:none}
.np-menu button{border:0;background:transparent;color:var(--on);text-align:left;padding:11px 12px;border-radius:10px;font-size:13px;cursor:pointer}
.np-menu button:active{background:var(--line)}
.big-cover{
 width:min(78vw,320px);aspect-ratio:1;margin:0 auto;border-radius:44px;
 background:var(--a1);color:var(--on-a1);
 display:grid;place-items:center;box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.big-cover svg{width:46%;height:46%}
.np-meta{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.np-title-row{display:flex;align-items:center;gap:12px}
.sheet-title{flex:1;min-width:0;text-align:left;font-size:19px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;color:var(--on)}
.sheet-artist{text-align:left;color:var(--muted);font-size:13px;margin-top:0}
.np-heart{flex:none;border:0;background:transparent;color:var(--muted);padding:8px;cursor:pointer;border-radius:50%}
.np-heart.on{color:var(--a2)}
.sheet .wave{height:24px;margin-top:0}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:0}
.controls{width:100%;margin:0;display:flex;align-items:center;justify-content:space-between;gap:clamp(2px,1.5vw,8px)}
.ctrl{flex:none;border:0;background:transparent;color:var(--on);width:var(--ctrl);height:var(--ctrl);border-radius:20px;cursor:pointer;display:grid;place-items:center}
.ctrl svg{width:58%;height:58%}
.ctrl:active{background:var(--card2)}
.ctrl.main{
 background:var(--a1);color:var(--on-a1);width:clamp(88px,26vw,112px);height:clamp(56px,16vw,68px);border-radius:22px;
 box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.ctrl.main:active{filter:brightness(.95)}
.ctrl.main svg{width:48%;height:48%}
.ctrl.secondary{width:var(--ctrl-s);height:var(--ctrl-s);border-radius:14px;color:var(--muted)}
.ctrl.secondary svg{width:62%;height:62%}
.ctrl.on{color:var(--a2)}
.settings{position:fixed;inset:0;z-index:15;display:flex;align-items:stretch;justify-content:center}
.settings[hidden]{display:none}
.settings-backdrop{position:absolute;inset:0;background:var(--bg)}
.settings-panel{
 position:relative;width:100%;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
 background:var(--bg);display:flex;flex-direction:column;
 padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
}
.settings-page{flex:1;display:flex;flex-direction:column}
.settings-page[hidden]{display:none}
.settings-head{display:flex;align-items:center;justify-content:space-between;min-height:40px;color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.settings-head .side{width:36px}
.settings-title{color:var(--on);font-size:12px;font-weight:600}
.setting-row{
 display:flex;align-items:center;gap:14px;width:100%;text-align:left;
 background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;
 color:var(--on);cursor:pointer;transition:transform .15s,background .15s;
}
.setting-row:active{transform:scale(.985);background:var(--card2)}
.setting-icon{
 width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;
 background:var(--a1);color:var(--on-a1);
}
.setting-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.setting-text b{font-size:16px;font-weight:600}
.setting-text span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setting-chevron{color:var(--muted);flex:none}
.accent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.accent-item{
 border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:16px;
 padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;line-height:1.2;text-align:center;
}
.accent-item:active{background:var(--card2)}
.accent-item.on{color:var(--on)}
.accent-dot{
 width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
 background:var(--a2);color:var(--on-a2);
 box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);
}
.accent-item.on .accent-dot{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--a1)}
.accent-dot.system{background:var(--a1);color:var(--on-a1)}
.accent-dot svg{width:18px;height:18px}
 /* Экран «Любимые треки»: плоский тёмный список и плавающая навигация */
.app.float-nav .bottom{display:none}
.app.float-nav .main{padding-bottom:120px}
.app.float-nav.has-mini .nav-float{bottom:calc(100px + env(safe-area-inset-bottom))}
.liked-view .subhead{padding:16px 4px 6px;min-height:0}
.liked-view .subhead b{text-align:left;font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.liked-view .subhead .side{display:none}
.edit-pill{
 border:0;border-radius:999px;background:var(--card2);color:var(--on);
 padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;margin:2px 0 12px 4px;
}
.edit-pill:active{background:var(--line)}
.liked-list{gap:2px}
.liked-row{position:relative;gap:14px;min-height:74px;padding:10px 6px;border:0;border-radius:14px;background:transparent}
.liked-row:active{transform:none;background:var(--card)}
.liked-row.current{background:var(--card2);border-color:transparent}
.liked-row .cover{width:58px;height:58px;border-radius:12px}
.liked-row .cover::after{display:none}
.liked-row .meta b{font-size:16px;font-weight:700;color:var(--on)}
.liked-row .meta span{font-size:13px;color:var(--muted)}
.liked-row .dur{display:none}
.liked-row .dots{margin-left:auto;padding:10px;color:var(--muted)}
.liked-row .dots svg{width:20px;height:20px;fill:currentColor}
.liked-row .row-remove{
 display:none;margin-left:auto;border:0;background:transparent;color:var(--a2);
 padding:10px;cursor:pointer;
}
.liked-view.edit-mode .liked-row .dots{display:none}
.liked-view.edit-mode .liked-row .row-remove{display:grid;place-items:center}
.row-menu{
 position:absolute;right:8px;top:58px;z-index:6;min-width:190px;padding:6px;
 background:var(--card2);border:1px solid var(--line);border-radius:14px;
 box-shadow:0 12px 28px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px;
}
.row-menu[hidden]{display:none}
.row-menu button{
 border:0;background:transparent;color:var(--on);text-align:left;
 padding:11px 12px;border-radius:10px;font-size:13px;cursor:pointer;
}
.row-menu button:active{background:var(--line)}
.nav-float{
 position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
 width:min(420px,calc(100% - 36px));z-index:8;display:flex;gap:6px;
 padding:8px 10px;border-radius:22px;background:#2a2a2f;box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.nav-float[hidden]{display:none}
.nav-float button{
 flex:1;min-height:44px;border:0;border-radius:16px;background:transparent;
 color:var(--muted);display:grid;place-items:center;cursor:pointer;
}
.nav-float button.active{color:var(--a1);background:rgba(255,255,255,.07)}
 /* Экран поиска: аватар, крупная строка поиска и недавние треки */
.search-brand{display:flex;align-items:center;gap:12px}
.search-brand[hidden]{display:none}
.search-brand b{font-size:20px;font-weight:700;letter-spacing:-.2px}
.avatar{
 width:34px;height:34px;flex:none;border-radius:50%;
 background:var(--a1);color:var(--on-a1);display:grid;place-items:center;
}
.avatar svg{width:20px;height:20px}
.app.search-mode .brand{display:none}
.searchbox{height:56px;border:0;border-radius:18px;background:var(--card2)}
.search-view .list-head{
 padding:20px 4px 10px;color:var(--on);font-size:15px;font-weight:700;
 letter-spacing:0;text-transform:none;
}
.search-view .list-head #res-count{color:var(--muted);font-size:12px;font-weight:400}
.search-view .track .cover::after{display:none}
.history-list{display:flex;flex-direction:column}
.history-row{
 position:relative;display:flex;align-items:center;gap:14px;
 padding:12px 4px;cursor:pointer;border-bottom:1px solid var(--line);
}
.history-row:active{background:var(--card)}
.history-row .cover{width:52px;height:52px;border-radius:12px}
.history-row .cover::after{display:none}
.history-row .meta b{font-size:15px;font-weight:700;color:var(--on)}
.artist-line{display:flex;align-items:center;gap:6px;min-width:0}
.artist-line .artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sources{display:inline-flex;align-items:center;gap:4px;flex:none;color:var(--muted)}
.sources svg{width:13px;height:13px;opacity:.8}
.history-clear{border:0;background:transparent;color:var(--muted);padding:10px;cursor:pointer;flex:none}
.history-clear svg{width:18px;height:18px}
.history-empty{color:var(--muted);font-size:13px;text-align:center;padding:28px 8px}
.history-empty[hidden]{display:none}
 .toast{
 position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
 transform:translate(-50%,12px);background:var(--on);color:var(--bg);
 padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;
 pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:86%;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="search-brand" id="search-brand" hidden>
      <span class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-3.7 3.6-6 7.5-6s6.9 2.3 7.5 6"/></svg>
      </span>
      <b>Поиск</b>
    </div>
    <div class="brand">
      <div class="mark">N</div>
      <div class="brand-text"><strong>NS</strong><span>NeverSleep</span></div>
    </div>
    <div class="head-actions">
      <button class="icon-btn add" id="add" type="button" aria-label="Добавить аудиофайлы">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="settings" type="button" aria-label="Настройки">

   var on = t && fav.indexOf(t.id) >= 0;
   m.innerHTML = '<button type="button" data-np-action="fav">' + (on ? 'Убрать из любимого' : 'Добавить в любимое') + '</button>' +
    '<button type="button" data-np-action="close">Свернуть плеер</button>';
  }
 });
 $('sheet-menu-pop').addEventListener('click', function(e){
  var b = e.target.closest('[data-np-action]');
  if(!b) return;
  this.hidden = true;
  if(b.getAttribute('data-np-action') === 'fav'){ if(currentId) toggleFav(currentId); }
  else closeSheet();
 });
 $('sheet-loop').addEventListener('click', function(){
  loop = !loop;
  updatePlayer();
  toast(loop ? 'Повтор включён' : 'Повтор выключен');
 });
 $('sheet-shuffle').addEventListener('click', function(){
  shuffle = !shuffle;
  updatePlayer();
  toast(shuffle ? 'Перемешивание включено' : 'Перемешивание выключено');
 });

 window.addEventListener('resize', drawWaves);

 // Кнопка «назад» Android: настройки → шторка → поиск → очистка запроса → выход.
 window.nsBack = function(){
  if(!$('settings-sheet').hidden){
   if(!$('settings-page-color').hidden){ closeColorSettings(); return true; }
   closeSettings(); return true;
  }
  if(sheetOpen){ closeSheet(); return true; }
  if(favView){
   showFavOverview();
   $('view-fav').hidden = false;
   document.querySelector('.main').scrollTop = 0;
   return true;
  }
  if(tab === 'fav'){ switchTab('search'); return true; }
  if(query){
   $('q').value = ''; query = ''; $('clear').hidden = true; render();
   return true;
  }
  return false;
 };

 setSearchMode(true);
 render();
 updatePlayer();
})();
</script>
</body>
</html>
