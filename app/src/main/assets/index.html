<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffbfe" id="meta-theme">
<title>NS — NeverSleep</title>
<style>
*{box-sizing:border-box}
:root{
 color-scheme:light dark;
 --a1:#6750a4; --a1c:#eaddff; --on-a1:#ffffff;
 --a2:#7d5260; --a2c:#ffd8e4; --on-a2:#ffffff;
 --bg:#fffbfe; --surface:#e7e0ec; --card:#fdf9ff; --card2:#f3edf7;
 --on:#1d1b20; --muted:#49454f; --line:#cac4d0;
}
@media (prefers-color-scheme:dark){
 :root{
  --a1:#d0bcff; --a1c:#4f378b; --on-a1:#381e72;
  --a2:#efb8c8; --a2c:#633b48; --on-a2:#491f2b;
  --bg:#141218; --surface:#49454f; --card:#211f26; --card2:#2b2930;
  --on:#ede7f6; --muted:#cac4d0; --line:#49454f;
 }
}
html,body{margin:0;height:100%}
body{
 font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
 background:var(--bg);color:var(--on);
 -webkit-tap-highlight-color:transparent;
 overscroll-behavior:none;
}
button,input{font:inherit}
.app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 10px}
.brand{display:flex;align-items:center;gap:12px}
.mark{
 width:42px;height:42px;border-radius:14px;
 background:linear-gradient(135deg,var(--a1),var(--a2));
 color:var(--on-a1);display:grid;place-items:center;
 font-weight:800;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:20px;letter-spacing:.7px}
.brand-text span{font-size:11px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
.swatch{display:flex;gap:6px;padding-right:4px}
.swatch i{width:13px;height:13px;border-radius:50%;background:var(--a1);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatch i+i{background:var(--a2)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 24px}
.view[hidden]{display:none}
.hero{padding:18px 4px 20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:var(--a2)}
h1{margin:6px 0 4px;font-size:30px;letter-spacing:-.6px;font-weight:700}
.hero p{margin:0;color:var(--muted);font-size:14px}
.searchbox{
 display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 14px;
 background:var(--surface);border:1px solid var(--line);border-radius:18px;color:var(--muted);
}
.searchbox svg{flex:none}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--on);font-size:15px}
.searchbox input::placeholder{color:var(--muted);opacity:.85}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.icon-btn:active{background:var(--a1c);color:var(--a1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--a2c);border-color:transparent;color:var(--a2);font-weight:600}
.list-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.1px;padding:20px 4px 8px}
.tracks{display:flex;flex-direction:column;gap:8px}
.track{
 display:flex;align-items:center;gap:12px;background:var(--card);
 border:1px solid var(--line);border-radius:18px;padding:10px 12px;
 cursor:pointer;transition:transform .15s,background .15s;
}
.track:active{transform:scale(.985);background:var(--card2)}
.cover{
 width:46px;height:46px;flex:none;border-radius:14px;
 background:linear-gradient(135deg,var(--a1),var(--a2));
 color:var(--on-a1);display:grid;place-items:center;
 font-weight:800;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
}
.track:nth-child(even) .cover{background:linear-gradient(135deg,var(--a2),var(--a1))}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fav-btn{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.fav-btn.on{color:var(--a2)}
.fav-btn:active{background:var(--a2c)}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty svg{color:var(--a2);opacity:.9}
.empty b{display:block;color:var(--on);margin:14px 0 6px;font-size:17px}
.empty p{margin:0;font-size:13px;line-height:1.5}
.bottom{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.tab{
 position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
 min-height:54px;border:0;border-radius:18px;background:transparent;
 color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;
}
.tab::before{content:"";position:absolute;inset:0;border-radius:18px;background:var(--a1c);opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s}
.tab.active{color:var(--a1)}
.tab.active::before{opacity:.6;transform:scale(1)}
.tab>*{position:relative;z-index:1}
.badge{
 min-width:20px;height:20px;padding:0 5px;border-radius:10px;
 background:var(--a2);color:var(--on-a2);font-size:11px;
 display:none;place-items:center;font-variant-numeric:tabular-nums;
}
.badge.show{display:grid}
.toast{
 position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
 transform:translate(-50%,12px);background:var(--on);color:var(--bg);
 padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;
 pointer-events:none;transition:opacity .2s,transform .2s;z-index:5;
 max-width:86%;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">N</div>
      <div class="brand-text"><strong>NS</strong><span>NeverSleep</span></div>
    </div>
    <div class="swatch" title="Акценты из цветов системы"><i></i><i></i></div>
  </header>

  <main class="main">
    <section class="view" id="view-search">
      <div class="hero">
        <span class="eyebrow">КАТАЛОГ</span>
        <h1>Найди свой звук</h1>
        <p>Демо-подборка NS. Нажми трек или ♥, чтобы добавить в любимое.</p>
      </div>
      <label class="searchbox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Трек или исполнитель" autocomplete="off" aria-label="Поиск треков">
        <button class="icon-btn" id="clear" type="button" aria-label="Очистить поиск" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </label>
      <div class="chips" id="chips"></div>
      <div class="list-head"><span>Результаты</span><span id="res-count"></span></div>
      <div class="tracks" id="results"></div>
    </section>

    <section class="view" id="view-fav" hidden>
      <div class="hero">
        <span class="eyebrow">ПЛЕЙЛИСТ</span>
        <h1>Любимое</h1>
        <p id="fav-sub">Пока пусто</p>
      </div>
      <div class="tracks" id="fav-list"></div>
      <div class="empty" id="fav-empty" hidden>
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-8.2C1 8.6 3 5 6.5 5 9 5 10.6 6.3 12 8c1.4-1.7 3-3 5.5-3 3.5 0 5.5 3.6 3.7 6.8C19 15.4 12 20 12 20z"/><path d="M4 12h4l2-3 3 6 2-3h5"/></svg>
        <b>Здесь будет твой плейлист</b>
        <p>Открой «Поиск» и нажми сердечко у трека,<br>которое хочешь сохранить.</p>
      </div>
    </section>
  </main>

  <nav class="bottom" aria-label="Навигация">
    <button class="tab active" type="button" data-tab="search" aria-current="page">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>Поиск</span>
    </button>
    <button class="tab" type="button" data-tab="fav">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5h6l2 2h8v12H4z"/></svg>
      <span>Любимое</span>
      <span class="badge" id="badge">0</span>
    </button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
 'use strict';

 // Демо-каталог. Позже вместо него можно подключить локальные файлы или API.
 var TRACKS = [
  {id:'t1', title:'Ночной город', artist:'Neon Kids', dur:'3:42', g:'electro', genre:'Электро'},
  {id:'t2', title:'Сон на берегу', artist:'Mirage FM', dur:'4:15', g:'ambient', genre:'Эмбиент'},
  {id:'t3', title:'Неон в дождь', artist:'Лёд 9', dur:'2:58', g:'hiphop', genre:'Хип-хоп'},
  {id:'t4', title:'Тихий космос', artist:'Astra', dur:'5:21', g:'ambient', genre:'Эмбиент'},
  {id:'t5', title:'Последний поезд', artist:'Кассета', dur:'3:07', g:'indie', genre:'Инди'},
  {id:'t6', title:'Гравитация', artist:'Pulse 88', dur:'4:02', g:'electro', genre:'Электро'},
  {id:'t7', title:'Утро без кофе', artist:'Медленный день', dur:'2:44', g:'indie', genre:'Инди'},
  {id:'t8', title:'Город спит', artist:'DSP', dur:'3:33', g:'hiphop', genre:'Хип-хоп'}
 ];
 var GENRES = [
  {id:'electro', name:'Электро'}, {id:'ambient', name:'Эмбиент'},
  {id:'hiphop', name:'Хип-хоп'}, {id:'indie', name:'Инди'}
 ];
 var KEY = 'ns:favorites:v1';

 function $(id){ return document.getElementById(id); }
 function esc(s){
  return String(s).replace(/[&<>"']/g, function(m){
   return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
 }
 function load(){
  try{
   var a = JSON.parse(localStorage.getItem(KEY) || '[]');
   if(!Array.isArray(a)) return [];
   return a.filter(function(id){
    return TRACKS.some(function(t){ return t.id === id; });
   });
  }catch(e){ return []; }
 }
 function save(){ try{ localStorage.setItem(KEY, JSON.stringify(fav)); }catch(e){} }

 var fav = load();
 var tab = 'search', genre = 'all', query = '', toastTimer;

 /* --- Системные цвета Material You: два акцента a1/a2 --- */
 function rgb(hex){
  var h = String(hex || '').replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length !== 6) return null;
  var n = parseInt(h, 16);
  return isNaN(n) ? null : [(n>>16)&255, (n>>8)&255, n&255];
 }
 function mix(a, b, t){
  var x = rgb(a), y = rgb(b);
  if(!x || !y) return a;
  return '#' + x.map(function(v, i){
   return ('0' + Math.round(v + (y[i] - v) * t).toString(16)).slice(-2);
  }).join('');
 }
 function applyColors(c){
  if(!c || !c.a1) return;
  var s = document.documentElement.style;
  function set(k, v){ if(v) s.setProperty('--' + k, v); }
  set('a1', c.a1); set('a1c', c.a1c); set('on-a1', c.onA1);
  set('a2', c.a2); set('a2c', c.a2c); set('on-a2', c.onA2);
  set('bg', c.bg); set('surface', c.surface);
  set('on', c.onSurface); set('muted', c.muted); set('line', c.outline);
  set('card', mix(c.bg, c.a1, 0.05));
  set('card2', mix(c.bg, c.surface, 0.55));
  if(c.bg) $('meta-theme').setAttribute('content', c.bg);
 }
 window.nsApplySystemColors = applyColors;
 try{
  if(window.NSBridge && window.NSBridge.colors) applyColors(JSON.parse(window.NSBridge.colors()));
 }catch(e){}

 /* --- Рендер --- */
 function heart(on){
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="' + (on ? 'currentColor' : 'none') +
   '" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-8.2C1 8.6 3 5 6.5 5 9 5 10.6 6.3 12 8c1.4-1.7 3-3 5.5-3 3.5 0 5.5 3.6 3.7 6.8C19 15.4 12 20 12 20z"/></svg>';
 }
 function row(t, isFav){
  return '<article class="track" data-id="' + esc(t.id) + '">' +
   '<div class="cover">' + esc(t.title.slice(0, 1)) + '</div>' +
   '<div class="meta"><b>' + esc(t.title) + '</b><span>' + esc(t.artist) + ' · ' + esc(t.genre) + '</span></div>' +
   '<span class="dur">' + esc(t.dur) + '</span>' +
   '<button class="fav-btn' + (isFav ? ' on' : '') + '" type="button" data-fav="' + esc(t.id) +
   '" aria-label="' + (isFav ? 'Убрать из любимого' : 'Добавить в любимое') + '">' + heart(isFav) + '</button>' +
   '</article>';
 }
 function renderChips(){
  var all = [{id:'all', name:'Всё'}].concat(GENRES);
  $('chips').innerHTML = all.map(function(g){
   return '<button class="chip' + (genre === g.id ? ' on' : '') + '" type="button" data-genre="' +
    esc(g.id) + '">' + esc(g.name) + '</button>';
  }).join('');
 }
 function renderResults(){
  var q = query.trim().toLowerCase();
  var list = TRACKS.filter(function(t){
   return (genre === 'all' || t.g === genre) &&
    (!q || (t.title + ' ' + t.artist + ' ' + t.genre).toLowerCase().indexOf(q) >= 0);
  });
  $('results').innerHTML = list.length
   ? list.map(function(t){ return row(t, fav.indexOf(t.id) >= 0); }).join('')
   : '<div class="empty"><b>Ничего не найдено</b><p>Попробуй другой запрос или жанр.</p></div>';
  $('res-count').textContent = list.length + ' трек(ов)';
 }
 function renderFav(){
  var list = TRACKS.filter(function(t){ return fav.indexOf(t.id) >= 0; });
  $('fav-list').innerHTML = list.map(function(t){ return row(t, true); }).join('');
  $('fav-empty').hidden = list.length > 0;
  $('fav-sub').textContent = list.length ? list.length + ' трек(ов) в плейлисте' : 'Пока пусто';
  var badge = $('badge');
  badge.textContent = String(fav.length);
  badge.classList.toggle('show', fav.length > 0);
 }
 function render(){ renderResults(); renderFav(); }

 function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
 }
 function toggleFav(id){
  var i = fav.indexOf(id);
  if(i >= 0){ fav.splice(i, 1); toast('Удалено из любимого'); }
  else { fav.push(id); toast('Добавлено в любимое'); }
  save();
  render();
 }
 function switchTab(name){
  tab = name;
  $('view-search').hidden = name !== 'search';
  $('view-fav').hidden = name !== 'fav';
  var tabs = document.querySelectorAll('.tab');
  for(var i = 0; i < tabs.length; i++){
   var on = tabs[i].getAttribute('data-tab') === name;
   tabs[i].classList.toggle('active', on);
   if(on) tabs[i].setAttribute('aria-current', 'page');
   else tabs[i].removeAttribute('aria-current');
  }
  document.querySelector('.main').scrollTop = 0;
  if(name === 'search') setTimeout(function(){ try{ $('q').focus({preventScroll:true}); }catch(e){ $('q').focus(); } }, 60);
 }

 /* --- События --- */
 document.querySelector('.bottom').addEventListener('click', function(e){
  var b = e.target.closest('[data-tab]');
  if(b) switchTab(b.getAttribute('data-tab'));
 });
 $('chips').addEventListener('click', function(e){
  var b = e.target.closest('[data-genre]');
  if(!b) return;
  genre = b.getAttribute('data-genre');
  renderChips();
  renderResults();
 });
 $('q').addEventListener('input', function(){
  query = this.value;
  $('clear').hidden = !query;
  renderResults();
 });
 $('clear').addEventListener('click', function(){
  $('q').value = ''; query = ''; this.hidden = true; renderResults(); $('q').focus();
 });
 function onListClick(e){
  var b = e.target.closest('[data-fav]');
  if(b){ toggleFav(b.getAttribute('data-fav')); return; }
  var rowEl = e.target.closest('[data-id]');
  if(rowEl) toggleFav(rowEl.getAttribute('data-id'));
 }
 $('results').addEventListener('click', onListClick);
 $('fav-list').addEventListener('click', onListClick);

 // Кнопка «назад» Android: сначала сбрасываем фильтры/возвращаемся в поиск, затем выходим.
 window.nsBack = function(){
  if(tab === 'fav'){ switchTab('search'); return true; }
  if(query || genre !== 'all'){
   $('q').value = ''; query = ''; genre = 'all';
   $('clear').hidden = true; renderChips(); renderResults();
   return true;
  }
  return false;
 };

 renderChips();
 render();
})();
</script>
</body>
</html>
